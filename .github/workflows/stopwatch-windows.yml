name: Build Windows stopwatch app

# Artifact-only build for this feature branch; never publishes a release.
on:
  push:
    branches: [codex/session-stopwatch]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Check stopwatch and desktop lifecycle
        run: node --import tsx --test tests/session-stopwatch.test.ts tests/session-stopwatch-ui.test.tsx tests/session-timer-store.test.ts tests/session-timer-shutdown.test.ts tests/session-core.test.ts tests/keyboard-layout-rebind.test.tsx tests/desktop-platform.test.ts tests/file-path-preload.test.ts
        env:
          NODE_ENV: test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      - name: Package Windows installer without publishing
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: LearnHarness-stopwatch-windows
          path: dist/*-setup.exe
          if-no-files-found: error
          retention-days: 7
